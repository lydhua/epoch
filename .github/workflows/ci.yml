name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formatting:
    name: Formatting and Python lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - run: find simulator -type f \( -name '*.cpp' -o -name '*.hpp' \) -exec .venv/bin/clang-format --dry-run --Werror {} +
      - run: .venv/bin/ruff check simulator/tests ml practice api
      - run: .venv/bin/ruff format --check simulator/tests ml practice api

  api-tests:
    name: API and PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
        env:
          POSTGRES_USER: epoch
          POSTGRES_PASSWORD: epoch-ci-only
          POSTGRES_DB: epoch_test_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epoch -d epoch_test_api"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      EPOCH_TEST_DATABASE_URL: postgresql+psycopg://epoch:epoch-ci-only@localhost:5432/epoch_test_api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m venv "$RUNNER_TEMP/uv-tool"
      - run: '"$RUNNER_TEMP/uv-tool/bin/python" -m pip install uv==0.7.13'
      - run: '"$RUNNER_TEMP/uv-tool/bin/uv" sync --locked --python 3.12 --extra api --group api-test'
      - run: .venv/bin/python -m unittest discover -s api/tests -v

  practice-tests:
    name: Practice contracts and baseline scheduler
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m unittest discover -s practice/tests -v

  python-tests:
    name: PyTorch tests and simulator-to-model smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m venv "$RUNNER_TEMP/uv-tool"
      - run: '"$RUNNER_TEMP/uv-tool/bin/python" -m pip install uv==0.7.13'
      - run: '"$RUNNER_TEMP/uv-tool/bin/uv" sync --locked --python 3.12'
      - run: .venv/bin/python -m unittest discover -s ml/tests -v
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ./build/epoch-simulate --output "$RUNNER_TEMP/epoch-smoke.csv" --sessions 60 --users 6 --reviews 8 --seed 42
      - run: .venv/bin/python -m ml.train --data "$RUNNER_TEMP/epoch-smoke.csv" --output "$RUNNER_TEMP/epoch-smoke-run" --epochs 3

  native-tests:
    name: C++ / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        build_type: [Debug, Release]
    env:
      CXX: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build with warnings as errors
        run: cmake --build build --parallel 2
      - name: Unit and CLI integration tests
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-24.04
    env:
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DEPOCH_SANITIZERS=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
